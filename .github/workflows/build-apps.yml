name: Build native desktop apps

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Rust checks and apps on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux audio build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build launcher and direct-launch studios
        run: cargo build --release --locked --bins

      - name: Upload native executables
        uses: actions/upload-artifact@v4
        with:
          name: BeatCraft-${{ runner.os }}-${{ github.ref_name }}
          path: target/release/beatcraft-*
          if-no-files-found: error
          retention-days: 30

      - name: Package archives
        id: package
        shell: bash
        run: |
          set -euo pipefail
          OS="${{ runner.os }}"
          REF="${GITHUB_REF_NAME}"
          if [ "$OS" = "Windows" ]; then
            pkg="beatcraft-studio-${REF}-windows-x86_64"
            mkdir "$pkg" && cp LICENSE README.md "$pkg/" && cp target/release/beatcraft-*.exe "$pkg/"
            7z a "${pkg}.zip" "$pkg/" >/dev/null
          elif [ "$OS" = "macOS" ]; then
            pkg="beatcraft-studio-${REF}-macos"
            mkdir "$pkg" && cp LICENSE README.md "$pkg/" && cp target/release/beatcraft-* "$pkg/" 2>/dev/null || true
            tar -czf "${pkg}.tar.gz" "$pkg"
          else
            pkg="beatcraft-studio-${REF}-linux-x86_64"
            mkdir "$pkg" && cp LICENSE README.md "$pkg/" && cp target/release/beatcraft-* "$pkg/" 2>/dev/null || true
            tar -czf "${pkg}.tar.gz" "$pkg"
          fi
          ls -lh -- *.zip *.tar.gz 2>/dev/null || ls -lh *.zip *.tar.gz

      - name: Upload packaged archives
        uses: actions/upload-artifact@v4
        with:
          name: BeatCraft-pkg-${{ runner.os }}-${{ github.ref_name }}
          path: beatcraft-studio-${{ github.ref_name }}-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: BeatCraft-pkg-*
          merge-multiple: true

      - name: Checksums and publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            beatcraft-studio-*.zip
            beatcraft-studio-*.tar.gz
          generate_release_notes: true
          prerelease: false
