[package]
name = "beatcraft-studio"
version = "2.7.0"
edition = "2021"
rust-version = "1.88"
description = "A native, local-first Rust desktop beatmaking studio for phonk and funk."
license = "GPL-3.0-or-later"

[lib]
name = "beatcraft_studio"
path = "src/lib.rs"

[[bin]]
name = "beatcraft-studio"
path = "src/main.rs"

[[bin]]
name = "beatcraft-drift"
path = "src/bin/drift.rs"

[[bin]]
name = "beatcraft-boogie"
path = "src/bin/boogie.rs"

[[bin]]
name = "beatcraft-rhythm"
path = "src/bin/rhythm.rs"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.8"
midly = "0.5.3"
midir = "0.10"
cpal = "0.15.3"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
rtrb = "0.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
